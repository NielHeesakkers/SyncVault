name: Build and Push Docker Image

# Runs on the self-hosted Forgejo runner on the Mac mini (label "docker").
# Job container is docker:27-cli with the host Docker socket mounted, so
# docker build/push run against the mini's Docker Desktop (with its layer
# cache). No DinD. Image → Codeberg container registry.

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build-and-push:
    runs-on: docker
    steps:
      - name: Build and push
        # docker:27-cli is Alpine — it has no bash, and Forgejo runs `run:` with
        # bash by default (exit 127). Use sh.
        shell: sh
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -eu
          apk add --no-cache git
          REPO=codeberg.org/nielheesakkers/syncvault

          # Manual checkout (docker:27-cli has no node, so no actions/checkout).
          # Authenticated clone — Codeberg returns 401 for anonymous git even on
          # a public repo, so embed the token (REGISTRY_TOKEN has repo read).
          git clone --quiet "https://nielheesakkers:${REGISTRY_TOKEN}@codeberg.org/NielHeesakkers/SyncVault.git" src
          cd src
          git checkout --quiet "${GITHUB_SHA}"

          # Tags: always :latest; on a vX.Y.Z tag also the bare version.
          TAGFLAGS="-t ${REPO}:latest"
          PUSH_TAGS="${REPO}:latest"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
            TAGFLAGS="${TAGFLAGS} -t ${REPO}:${V}"
            PUSH_TAGS="${PUSH_TAGS} ${REPO}:${V}"
          fi

          echo "${REGISTRY_TOKEN}" | docker login codeberg.org -u nielheesakkers --password-stdin
          docker build \
            --build-arg GIT_SHA="${GITHUB_SHA}" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            ${TAGFLAGS} .
          for t in ${PUSH_TAGS}; do docker push "$t"; done
